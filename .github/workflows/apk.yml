# Builds an installable .apk to sideload on your own phone (no keystore or secrets needed).
# Builds only when asked: a pushed commit whose message contains [apk], or by hand from the Actions tab
# ("Build test APK" -> Run workflow; that button needs this file on the default branch). Other pushes skip it.
# The apk is attached to the "apk-latest" GitHub Release: open that release on your phone and tap the .apk.
# This is a debug-signed test build. Play Store builds still come from android.yml (.aab).
name: Build test APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*', 'claude/*']
    paths-ignore: ['store/**', 'docs/**', 'README.md']
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    concurrency:
      group: apk-latest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets
      - name: Sync web files and apply Android settings
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.0-build${{ github.run_number }}
        run: npm run sync
      - name: Build the debug apk
        # Sign with the committed test key so each new apk installs as an update over the last one.
        run: |
          mkdir -p ~/.android && cp android-test-key/debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug
      - name: Name the apk
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "crypt-cards-test.apk"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: crypt-cards-apk
          path: crypt-cards-test.apk
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest crypt-cards-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Crypt Cards test APK" \
            --notes "Built from ${{ github.ref_name }} @ $SHORT (run ${{ github.run_number }}). On your phone: tap crypt-cards-test.apk below, then Open, and allow installs from your browser if Android asks."
